id: "instagram_open"
title: "Open Instagram"
description: "Opens Instagram on the selected phones and waits briefly so the app can load."
operator_note: "This preset does not perform likes, follows, comments, or messaging. It only opens the app for manual review."
steps:
  - type: LAUNCH_APP
    label: "Open Instagram"
    package: "com.instagram.android"
  - type: WAIT
    label: "Let Instagram load"
    min_seconds: 3
    max_seconds: 6
