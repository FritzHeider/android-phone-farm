[project]
name = "android-phone-farm"
version = "0.2.0"
description = "Local macOS Android device lab controller (ADB + USB hubs) with GUI/TUI/CLI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Android Phone Farm"}]

# Core deps needed for backend + TUI.
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "PyYAML>=6.0.1",
  "rich>=13.7.0",
  "httpx>=0.27.0",
  "textual>=0.70.0",
  "psutil>=5.9.8",
  "platformdirs>=4.2.0",
]

[project.optional-dependencies]
# GUI deps are optional so backend can run without GUI installed.
gui = [
  "PySide6>=6.7.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "tui*", "gui*"]
